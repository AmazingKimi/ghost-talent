name: Credibility CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .

      - name: Run credibility-focused tests
        run: |
          python -m unittest \
            tests.test_scoring \
            tests.test_credibility \
            tests.test_github_evidence \
            tests.test_benchmark \
            tests.test_snapshot
