<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Ghost Talent</title><link rel="icon" href="/favicon.svg"/><style>:root{--ink:#111;--muted:#6d6d6d;--line:#e8e8e8;--paper:#fafafa}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}main{max-width:1120px;margin:auto;padding:72px 28px 96px}h1{font-size:64px;letter-spacing:-.055em;margin:0 0 12px}.sub,.meta{color:var(--muted)}.search{display:flex;gap:10px;margin:36px 0}input{flex:1;padding:17px;border:1px solid #ccc;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:0 22px;background:#111;color:#fff;font-weight:700;cursor:pointer}.sources{display:flex;gap:8px;margin:12px 0 20px}.source,.pill{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:5px 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--paper)}.card.early{border-color:#111}.top{display:flex;justify-content:space-between}.name{font-weight:750;font-size:20px}.login,.small{color:var(--muted);font-size:12px}.score{font-size:34px;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.metric strong{display:block}.metric span{font-size:10px;color:var(--muted)}.signal{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.dossier-btn{width:100%;height:40px;margin-top:16px}.drawer{position:fixed;inset:0 0 0 auto;width:min(620px,100%);background:#fff;box-shadow:-20px 0 60px #0002;padding:32px;overflow:auto;transform:translateX(105%);transition:.2s;z-index:10}.drawer.open{transform:none}.close{float:right;background:#fff;color:#111;border:1px solid var(--line);height:38px}.drawer h2{font-size:38px;letter-spacing:-.04em;margin:36px 0 4px}.section{border-top:1px solid var(--line);padding-top:18px;margin-top:22px}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em}.section p,.section li{font-size:14px;line-height:1.55}.focus{display:flex;gap:6px;flex-wrap:wrap}.evidence a{color:#111;text-decoration:none}@media(max-width:650px){h1{font-size:48px}.search{flex-direction:column}button{height:50px}}</style></head><body><main><h1>Ghost Talent</h1><p class="sub">Discover emerging AI talent before they become obvious.</p><form class="search" id="form"><input id="q" value="LLM inference CUDA Triton"/><button>SCOUT</button></form><p class="meta" id="meta">Search public technical evidence from GitHub and OpenAlex.</p><div class="sources" id="sources"></div><section class="grid" id="results"></section></main><aside class="drawer" id="drawer"><button class="close" onclick="drawer.classList.remove('open')">CLOSE</button><div id="dossier"></div></aside><script>const form=document.getElementById('form'),q=document.getElementById('q'),meta=document.getElementById('meta'),sources=document.getElementById('sources'),results=document.getElementById('results'),drawer=document.getElementById('drawer'),dossier=document.getElementById('dossier');let rows=[];function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function sourceRows(m){return Object.entries(m||{}).map(([n,x])=>`<span class="source">${esc(n.toUpperCase())} · ${esc(x.status)}</span>`).join('')}function card(r,i){const c=r.candidate;return `<article class="card ${r.early_signal?'early':''}"><div class="top"><div><div class="name">${esc(c.name||c.login)}</div><div class="login">@${esc(c.login)}</div></div><div><div class="score">${r.ghost_score}</div><div class="small">GHOST SCORE</div></div></div><div class="metrics"><div class="metric"><strong>${r.capability}</strong><span>Capability</span></div><div class="metric"><strong>${r.momentum}</strong><span>Momentum</span></div><div class="metric"><strong>${r.visibility_gap}</strong><span>Visibility</span></div><div class="metric"><strong>${r.evidence_confidence}</strong><span>Confidence</span></div></div>${r.early_signal?`<span class="signal">EARLY SIGNAL · RADAR ${r.radar_score}</span>`:''}<p class="small">${esc(r.trend)} · v${esc(r.score_version)}</p><button class="dossier-btn" onclick="openDossier(${i})">VIEW DOSSIER</button></article>`}function openDossier(i){const r=rows[i],d=r.dossier||{},id=d.identity||{},s=d.signal||{},a=d.activity||{},focus=d.technical_focus||[],cons=d.important_contributions||[];dossier.innerHTML=`<h2>${esc(id.name||id.login)}</h2><p class="small">@${esc(id.login)} · ${esc(id.subject_id)} · confidence ${esc(id.confidence)}</p>${s.early_signal?`<p><span class="signal">EARLY SIGNAL · RADAR ${esc(s.radar_score)}</span></p>`:''}<div class="section"><h3>Technical Focus</h3><div class="focus">${focus.length?focus.map(x=>`<span class="pill">${esc(x)}</span>`).join(''):'<span class="small">Insufficient evidence</span>'}</div></div><div class="section"><h3>Why Now</h3><ul>${(d.why_now||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><h3>Trajectory</h3><p>7D ${esc(d.trajectory?.d7?.status||'building')} · 30D ${esc(d.trajectory?.d30?.status||'building')} · ${esc(d.trajectory?.observation_count||1)} observations</p><p>${esc(a.events_7d??'?')} events / 7d · ${esc(a.events_30d??'?')} / 30d · acceleration ${esc(a.acceleration_ratio??'?')}</p></div><div class="section evidence"><h3>Important Contributions</h3>${cons.length?cons.map(x=>`<p><a href="${esc(x.url)}" target="_blank">↗ ${esc(x.title)}</a>${x.repository?`<br><span class="small">${esc(x.repository)}</span>`:''}</p>`).join(''):'<p class="small">No high-confidence merged PR evidence in the current collection.</p>'}</div><div class="section"><h3>Identity & Evidence Confidence</h3><p>${(id.confidence_reasons||[]).map(esc).join(' · ')||'Limited evidence'}</p></div><div class="section"><h3>Research Boundary</h3><p class="small">${(d.limitations||[]).map(esc).join(' ')}</p><p><a href="${esc(id.profile_url)}" target="_blank">↗ GitHub profile</a></p></div>`;drawer.classList.add('open')}form.addEventListener('submit',async e=>{e.preventDefault();meta.textContent='Scouting…';results.innerHTML='';const r=await fetch(`/api/scout?q=${encodeURIComponent(q.value.trim())}&limit=20`),data=await r.json();if(!r.ok){meta.textContent=data.detail||'Scout failed';return}rows=data.results;sources.innerHTML=sourceRows(data.sources);meta.textContent=`${data.count} candidates · ${rows.filter(x=>x.early_signal).length} early signals · snapshot locked ${data.snapshot.observed_at}`;results.innerHTML=rows.map(card).join('')});</script></body></html>
