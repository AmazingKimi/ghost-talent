<!doctype html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Ghost Talent</title><link rel="icon" href="/favicon.svg"/><style>:root{--ink:#111;--muted:#6d6d6d;--line:#e8e8e8;--paper:#fafafa}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}main{max-width:1180px;margin:auto;padding:64px 28px 96px}h1{font-size:64px;letter-spacing:-.055em;margin:0 0 12px}.sub,.meta,.small{color:var(--muted)}.search{display:flex;gap:10px;margin:32px 0}input{flex:1;padding:17px;border:1px solid #ccc;border-radius:10px;font:inherit}button{border:0;border-radius:10px;padding:0 22px;background:#111;color:#fff;font-weight:700;cursor:pointer}.sources,.focus{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.source,.pill,.status,.strength{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:5px 8px}.summary{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 24px}.summary b{font-size:12px;border:1px solid var(--line);padding:8px 10px;border-radius:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--paper)}.card.signal-card{border-color:#111}.top{display:flex;justify-content:space-between;gap:12px}.name{font-weight:750;font-size:20px}.login,.small{font-size:12px}.score{font-size:32px;font-weight:800}.status{display:inline-block;font-weight:800;margin:12px 0}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.metric strong{display:block}.metric span{font-size:9px;color:var(--muted)}.trust{font-size:12px;line-height:1.5;border-top:1px solid var(--line);padding-top:12px}.dossier-btn{width:100%;height:40px;margin-top:14px}.drawer{position:fixed;inset:0 0 0 auto;width:min(680px,100%);background:#fff;box-shadow:-20px 0 60px #0002;padding:32px;overflow:auto;transform:translateX(105%);transition:.2s;z-index:10}.drawer.open{transform:none}.close{float:right;background:#fff;color:#111;border:1px solid var(--line);height:38px}.drawer h2{font-size:38px;letter-spacing:-.04em;margin:36px 0 4px}.section{border-top:1px solid var(--line);padding-top:18px;margin-top:22px}.section h3{font-size:12px;text-transform:uppercase;letter-spacing:.1em}.section p,.section li{font-size:14px;line-height:1.55}.contribution{border-top:1px solid var(--line);padding:14px 0}.contribution:first-of-type{border-top:0}.strength{display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase}.mix{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mix div{border:1px solid var(--line);padding:10px;border-radius:8px}.mix strong{display:block;font-size:18px}@media(max-width:650px){h1{font-size:48px}.search{flex-direction:column}button{height:50px}.metrics{grid-template-columns:repeat(3,1fr)}}</style></head><body><main><h1>Ghost Talent</h1><p class="sub">Discover emerging AI talent before they become obvious.</p><form class="search" id="form"><input id="q" value="LLM inference CUDA Triton"/><button>SCOUT</button></form><p class="meta" id="meta">Discovery is not recommendation. Strong signals require verified external evidence.</p><div class="sources" id="sources"></div><div class="summary" id="summary"></div><section class="grid" id="results"></section></main><aside class="drawer" id="drawer"><button class="close" onclick="drawer.classList.remove('open')">CLOSE</button><div id="dossier"></div></aside><script>const form=document.getElementById('form'),q=document.getElementById('q'),meta=document.getElementById('meta'),sources=document.getElementById('sources'),summary=document.getElementById('summary'),results=document.getElementById('results'),drawer=document.getElementById('drawer'),dossier=document.getElementById('dossier');let rows=[];function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function sourceRows(m){return Object.entries(m||{}).map(([n,x])=>`<span class="source">${esc(n.toUpperCase())} · ${esc(x.status)}</span>`).join('')}function reason(r){const e=r.drivers?.external_validation||{};if(!e.available)return'External validation not inspected — recommendation confidence capped.';if(r.recommendation_status==='PROVEN / ALREADY VISIBLE')return`Strong external evidence, but already visible (${r.candidate.followers||0} followers).`;if(e.recent_maintainer_accepted_core_path_prs)return`${e.recent_maintainer_accepted_core_path_prs} recent maintainer-approved core-path upstream PR(s).`;if(e.recognized_upstream_prs)return`${e.recognized_upstream_prs} recognized upstream PR(s); stronger gates not yet verified.`;if(e.external_merged_prs)return`${e.external_merged_prs} external merged PR(s), but limited recognized-upstream validation.`;return'Strong external validation not yet established.'}function card(r,i){const c=r.candidate,status=r.recommendation_status||'DISCOVERED',hot=['STRONG SIGNAL','EARLY SIGNAL'].includes(status);return `<article class="card ${hot?'signal-card':''}"><div class="top"><div><div class="name">${esc(c.name||c.login)}</div><div class="login">@${esc(c.login)}</div></div><div><div class="score">${r.radar_score}</div><div class="small">RADAR</div></div></div><span class="status">${esc(status)}</span><div class="metrics"><div class="metric"><strong>${r.external_validation}</strong><span>External</span></div><div class="metric"><strong>${r.internal_capability}</strong><span>Internal</span></div><div class="metric"><strong>${r.momentum}</strong><span>Momentum</span></div><div class="metric"><strong>${r.visibility_gap}</strong><span>Visibility gap</span></div><div class="metric"><strong>${r.evidence_confidence}</strong><span>Confidence</span></div></div><p class="trust">${esc(reason(r))}</p><p class="small">Ghost ${r.ghost_score} · ${esc(r.trend)} · model ${esc(r.score_version)}</p><button class="dossier-btn" onclick="openDossier(${i})">VIEW EVIDENCE DOSSIER</button></article>`}function contributionRows(cons){if(!cons.length)return'<p class="small">No merged-PR depth evidence in the current collection.</p>';return cons.map(x=>`<div class="contribution"><a href="${esc(x.url)}" target="_blank">↗ ${esc(x.title)}</a><br><span class="small">${esc(x.repository||'')}${x.number?` · PR #${esc(x.number)}`:''}</span><br><span class="strength">${esc(x.evidence_strength||'limited')} evidence</span><p class="small">${(x.evidence_facts||[]).map(esc).join(' · ')||'Limited collected evidence'}</p><p>${esc(x.interpretation||'')}</p></div>`).join('')}function openDossier(i){const r=rows[i],d=r.dossier||{},id=d.identity||{},s=d.signal||{},a=d.activity||{},mix=d.evidence_mix||{},ext=d.external_validation||{};dossier.innerHTML=`<h2>${esc(id.name||id.login)}</h2><p class="small">@${esc(id.login)} · ${esc(id.subject_id)} · confidence ${esc(id.confidence)}</p><p><span class="status">${esc(s.recommendation_status||'DISCOVERED')}</span></p><div class="section"><h3>Signal</h3><p>Radar <b>${esc(s.radar_score)}</b> · Ghost ${esc(s.ghost_score)} · External ${esc(s.external_validation)} · Internal ${esc(s.internal_capability)} · Visibility gap ${esc(s.visibility_gap)}</p></div><div class="section"><h3>Evidence Mix</h3><div class="mix"><div><strong>${esc(mix.self_owned_repo_pct??0)}%</strong><span class="small">Self-owned repo</span></div><div><strong>${esc(mix.external_repository_contribution_pct??0)}%</strong><span class="small">External repo contributions</span></div><div><strong>${esc(mix.verified_external_pr_pct??0)}%</strong><span class="small">Verified external PR</span></div><div><strong>${esc(mix.verified_research_pct??0)}%</strong><span class="small">Verified research</span></div></div></div><div class="section"><h3>External Validation</h3><p>${esc(ext.external_merged_prs??0)} external merged PRs · ${esc(ext.recognized_upstream_prs??0)} recognized upstream · ${esc(ext.core_path_prs??0)} core-path verified · ${esc(ext.maintainer_accepted_prs??0)} maintainer-approved</p></div><div class="section"><h3>Why This Status</h3><ul>${(d.why_now||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><h3>Technical Focus</h3><div class="focus">${(d.technical_focus||[]).length?d.technical_focus.map(x=>`<span class="pill">${esc(x)}</span>`).join(''):'<span class="small">Insufficient evidence</span>'}</div></div><div class="section"><h3>Trajectory</h3><p>7D ${esc(d.trajectory?.d7?.status||'building')} · 30D ${esc(d.trajectory?.d30?.status||'building')} · ${esc(d.trajectory?.observation_count||1)} observations</p><p>${esc(a.events_7d??'?')} events / 7d · ${esc(a.events_30d??'?')} / 30d · acceleration ${esc(a.acceleration_ratio??'?')}</p></div><div class="section"><h3>Important Contributions</h3>${contributionRows(d.important_contributions||[])}</div><div class="section"><h3>Research Boundary</h3><p class="small">${(d.limitations||[]).map(esc).join(' ')}</p><p><a href="${esc(id.profile_url)}" target="_blank">↗ GitHub profile</a></p></div>`;drawer.classList.add('open')}function summaryRows(){const labels=['STRONG SIGNAL','EARLY SIGNAL','WATCH','PROVEN / ALREADY VISIBLE','DISCOVERED','LOW CONFIDENCE'];summary.innerHTML=labels.map(x=>`<b>${rows.filter(r=>r.recommendation_status===x).length} ${esc(x)}</b>`).join('')}form.addEventListener('submit',async e=>{e.preventDefault();meta.textContent='Scouting and verifying evidence…';results.innerHTML='';summary.innerHTML='';const r=await fetch(`/api/scout?q=${encodeURIComponent(q.value.trim())}&limit=20`),data=await r.json();if(!r.ok){meta.textContent=data.detail||'Scout failed';return}rows=data.results;sources.innerHTML=sourceRows(data.sources);summaryRows();meta.textContent=`${data.count} discovered · ranking prioritizes recommendation status, then Radar · snapshot locked ${data.snapshot.observed_at}`;results.innerHTML=rows.map(card).join('')});</script></body></html>
