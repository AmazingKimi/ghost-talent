function toggleLanguage(){lang=lang==='en'?'zh':'en';localStorage.setItem('ghostTalentLang',lang);applyLanguage()}
function sourceHTML(s){return Object.entries(s||{}).map(([name,x])=>{const st=x.status||'unknown',cls=st==='ok'?'ok':st==='rate_limited'?'bad':'warn';let extra='';if(x.core_remaining_after!==undefined&&x.core_remaining_after!==null)extra=` · ${x.core_remaining_after} core`;return `<span class="source ${cls}">● ${esc(name)} · ${esc(st)}${esc(extra)}</span>`}).join('')}
function reason(r){const e=r.drivers?.external_validation||{};if(!e.available)return lang==='zh'?'外部验证尚未完整检查，因此推荐置信度受到限制。':'External validation not fully inspected — recommendation confidence is capped.';if(r.recommendation_status==='PROVEN / ALREADY VISIBLE')return lang==='zh'?`外部证据很强，但已经比较显眼（${r.candidate.followers||0} followers）。`:`Strong external evidence, but already visible (${r.candidate.followers||0} followers).`;if(e.recent_maintainer_accepted_core_path_prs)return lang==='zh'?`${e.recent_maintainer_accepted_core_path_prs} 个近期 maintainer 批准的核心路径上游 PR。`:`${e.recent_maintainer_accepted_core_path_prs} recent maintainer-approved core-path upstream PR(s).`;if(e.recognized_upstream_prs)return lang==='zh'?`${e.recognized_upstream_prs} 个已识别的上游 PR；更强门槛尚未验证。`:`${e.recognized_upstream_prs} recognized upstream PR(s); stronger gates not yet verified.`;if(e.external_merged_prs)return lang==='zh'?`${e.external_merged_prs} 个外部合并 PR，但知名上游验证仍有限。`:`${e.external_merged_prs} external merged PR(s), but limited recognized-upstream validation.`;return lang==='zh'?'尚未建立足够强的外部验证。':'Strong external validation not yet established.'}
function tags(r){return (r.dossier?.technical_profile||[]).slice(0,4).map(x=>`<span class="tag">${esc(x.term)}</span>`).join('')}function statusCounts(data){const c={};Object.keys(order).forEach(x=>c[x]=data.filter(r=>r.recommendation_status===x).length);return c}
function renderSummary(){const c=statusCounts(rows);$('summary').innerHTML=`<div class="summary-stat"><strong>${rows.length}</strong><span>${T().candidates}</span></div><div class="summary-stat"><strong>${c['STRONG SIGNAL']}</strong><span>${T().strong}</span></div><div class="summary-stat"><strong>${c['EARLY SIGNAL']}</strong><span>${T().early}</span></div><div class="summary-stat"><strong>${c['WATCH']}</strong><span>${T().watch}</span></div><div class="summary-stat"><strong>${c['DISCOVERED']}</strong><span>${T().discovered}</span></div><div class="summary-stat"><strong>${c['LOW CONFIDENCE']}</strong><span>${T().low}</span></div>`}
function renderFilters(){if(!['discover','watchlist','dossiers'].includes(activeView)){$('filters').innerHTML='';return}const data=activeView==='watchlist'?watchRows:rows,c=statusCounts(data),labels={'STRONG SIGNAL':T().strong,'EARLY SIGNAL':T().early,'WATCH':T().watch,'DISCOVERED':T().discovered,'LOW CONFIDENCE':T().low},dots={'STRONG SIGNAL':'red','EARLY SIGNAL':'amber','WATCH':'amber','DISCOVERED':'blue','LOW CONFIDENCE':'gray'};$('filters').innerHTML=`<button class="pill ${activeFilter==='ALL'?'active':''}" data-filter="ALL">${T().all} ${data.length}</button>`+Object.keys(labels).map(k=>`<button class="pill ${activeFilter===k?'active':''}" data-filter="${k}"><span class="dot ${dots[k]}"></span>${labels[k]} ${c[k]}</button>`).join('');document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{activeFilter=b.dataset.filter;renderCurrent()})}
function sorted(data){const mode=$('sort').value;return [...data].sort((a,b)=>mode==='radar'?b.radar_score-a.radar_score:mode==='external'?b.external_validation-a.external_validation:mode==='momentum'?b.momentum-a.momentum:mode==='confidence'?b.evidence_confidence-a.evidence_confidence:(order[b.recommendation_status]||0)-(order[a.recommendation_status]||0)||b.radar_score-a.radar_score)}
function card(r,i){const c=r.candidate||{},saved=watchRows.some(x=>String(x.candidate?.login).toLowerCase()===String(c.login).toLowerCase());return `<article class="card"><div class="card-head"><div class="identity"><span class="rank">#${i+1}</span><div class="avatar">${initials(c)}</div><div><div class="name">${esc(c.name||c.login)}</div><div class="login">@${esc(c.login)}</div></div></div><div class="score"><strong>${esc(r.radar_score)}</strong><span>RADAR</span></div></div><span class="status" data-status="${esc(r.recommendation_status||'DISCOVERED')}">${esc(r.recommendation_status||'DISCOVERED')}</span><div class="metrics"><div class="metric"><strong>${esc(r.external_validation)}</strong><span>${T().external}</span></div><div class="metric"><strong>${esc(r.internal_capability)}</strong><span>${T().internal}</span></div><div class="metric"><strong>${esc(r.momentum)}</strong><span>${T().momentum}</span></div><div class="metric"><strong>${esc(r.visibility_gap)}</strong><span>${T().visibility}</span></div><div class="metric"><strong>${esc(r.evidence_confidence)}</strong><span>${T().confidence}</span></div></div><div class="reason">${esc(reason(r))}</div><div class="tags">${tags(r)}</div><div class="actions"><button class="btn secondary" onclick="toggleWatch('${esc(c.login)}')">${saved?T().saved:T().addWatch}</button><button class="btn primary" onclick="openDossier('${esc(c.login)}')">${T().open}</button></div></article>`}
async function loadWatch(){try{const r=await fetch('/api/watchlist'),d=await r.json();watchRows=d.items||[]}catch(_){watchRows=[]}}async function toggleWatch(login){const existing=watchRows.find(x=>String(x.candidate?.login).toLowerCase()===login.toLowerCase());if(existing){await fetch(`/api/watchlist/${encodeURIComponent(login)}`,{method:'DELETE'});watchRows=watchRows.filter(x=>String(x.candidate?.login).toLowerCase()!==login.toLowerCase())}else{const row=rows.find(x=>String(x.candidate?.login).toLowerCase()===login.toLowerCase());if(!row)return;const r=await fetch(`/api/watchlist/${encodeURIComponent(login)}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(row)});if(r.ok)watchRows.push((await r.json()).item)}renderCurrent()}
function openDossier(login){const r=[...rows,...watchRows].find(x=>String(x.candidate?.login).toLowerCase()===login.toLowerCase());if(!r)return;const d=r.dossier||{},id=d.identity||r.candidate||{},rec=d.recommendation||{},s=d.signal||{},mix=d.evidence_mix||{},profile=d.technical_profile||[];$('dossier').innerHTML=`<h2>${esc(id.name||id.login)}</h2><p class="small">@${esc(id.login)} · ${T().confidence} ${esc(id.confidence??r.evidence_confidence)}</p><div class="decision"><span class="status" data-status="${esc(rec.status||r.recommendation_status)}">${esc(rec.status||r.recommendation_status)}</span><h3>${esc(rec.action||T().further)}</h3><p class="small"><b>${T().mainRisk}:</b> ${esc(rec.main_risk||T().insufficient)}</p></div><div class="section"><h3>${T().why}</h3><p>${esc(reason(r))}</p></div><div class="section"><h3>${T().profile}</h3>${profile.length?profile.map(x=>`<p><b>${esc(x.term)}</b> · ${esc(x.support)} evidence · ${esc(x.external_support)} external</p>`).join(''):`<p class="small">${T().insufficient}</p>`}</div><div class="section"><h3>${T().whyNow}</h3><ul>${(d.why_now||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="section"><h3>${T().mix}</h3><div class="mix"><div><strong>${esc(mix.self_owned_repo_pct??mix.self_owned_or_discovery_repo_pct??0)}%</strong><span class="small">${T().selfOwned}</span></div><div><strong>${esc(mix.external_repository_contribution_pct??mix.external_upstream_pct??0)}%</strong><span class="small">${T().externalContribution}</span></div></div></div><div class="section"><h3>${T().signalDetail}</h3><p>Radar <b>${esc(s.radar_score??r.radar_score)}</b> · Ghost ${esc(s.ghost_score??r.ghost_score)} · ${T().external} ${esc(s.external_validation??r.external_validation)} · ${T().momentum} ${esc(r.momentum)}</p></div>`;$('drawer').classList.add('open')}
function showAlert(title,body){$('alertTitle').textContent=title;$('alertBody').textContent=body;$('alert').classList.add('show')}function hideAlert(){$('alert').classList.remove('show')}function renderCards(data){let use=sorted(data);if(activeFilter!=='ALL')use=use.filter(r=>r.recommendation_status===activeFilter);$('results').innerHTML=use.length?use.map(card).join(''):`<div class="empty">${T().empty}</div>`}
function evidencePanels(){const data=rows.slice(0,12);$('panels').innerHTML=data.length?data.map(r=>{const m=r.dossier?.evidence_mix||{},e=r.dossier?.external_validation||{};return `<div class="panel"><h3>${esc(r.candidate?.name||r.candidate?.login)}</h3><div class="kv"><span>${T().selfOwned}</span><b>${esc(m.self_owned_repo_pct??m.self_owned_or_discovery_repo_pct??0)}%</b></div><div class="kv"><span>${T().externalContribution}</span><b>${esc(m.external_repository_contribution_pct??m.external_upstream_pct??0)}%</b></div><div class="kv"><span>Recognized upstream PRs</span><b>${esc(e.recognized_upstream_prs??0)}</b></div><div class="kv"><span>Maintainer-approved</span><b>${esc(e.maintainer_accepted_prs??0)}</b></div></div>`}).join(''):`<div class="empty">${T().empty}</div>`}
async function validationPanels(){if(!validationData){const r=await fetch('/api/validation');validationData=await r.json()}const d=validationData,s=d.summary||{},v=d.cohorts||[];$('panels').innerHTML=`<div class="panel"><h3>${T().protocol}</h3><div class="kv"><span>${T().version}</span><b>${esc(d.protocol)}</b></div><div class="kv"><span>${T().primaryHorizon}</span><b>${esc(s.primary_horizon_days)} days</b></div><div class="kv"><span>${T().headlineReady}</span><b>No</b></div></div><div class="panel"><h3>${T().frozenEvidence}</h3><div class="kv"><span>${T().registered}</span><b>${esc(s.registered)}</b></div><div class="kv"><span>${T().publicFrozen}</span><b>${esc(s.public_frozen)}</b></div><div class="kv"><span>${T().commitments}</span><b>${esc(s.freeze_time_committed)}</b></div></div><div class="panel"><h3>${T().interpretation}</h3><p class="small">${esc(d.message)}</p></div><div class="panel validation-table"><div class="validation-row header"><div>${T().cohort}</div><div>${T().score}</div><div>${T().size}</div><div>${T().artifact}</div><div>${T().sha}</div><div>${T().d90}</div></div>${v.map(x=>`<div class="validation-row"><div>${esc(x.id)}</div><div>${esc(x.score_version)}</div><div>${esc(x.size)}</div><div><span class="badge ${x.artifact_status==='public-frozen'?'good':'warn'}">${esc(x.artifact_status)}</span></div><div>${x.artifact_sha256_current?esc(x.artifact_sha256_current.slice(0,12))+'…':'—'}${x.freeze_time_commitment?' ✓':''}</div><div>${esc(x.maturity?.d90||'unknown')}</div></div>`).join('')}</div>`}
function settingsPanels(){$('panels').innerHTML=`<div class="panel"><h3>${T().runtime}</h3><div class="kv"><span>${T().localEndpoint}</span><b>127.0.0.1:8765</b></div><div class="kv"><span>${T().platform}</span><b>Mac / Windows</b></div><div class="kv"><span>${T().appVersion}</span><b>0.3.3</b></div><div class="kv"><span>${T().scoreModel}</span><b>0.2.8 · frozen</b></div></div><div class="panel"><h3>${T().sourcePolicy}</h3><p class="small">${T().settingsSource}</p></div><div class="panel"><h3>${T().integrityPolicy}</h3><p class="small">${T().settingsIntegrity}</p></div>`}
function analyticsPanels(){const c=statusCounts(rows),avg=rows.length?(rows.reduce((a,b)=>a+b.radar_score,0)/rows.length).toFixed(1):'—';$('panels').innerHTML=`<div class="panel"><h3>${T().currentScan}</h3><div class="kv"><span>${T().candidates}</span><b>${rows.length}</b></div><div class="kv"><span>${T().averageRadar}</span><b>${avg}</b></div></div><div class="panel"><h3>${T().decisionYield}</h3><div class="kv"><span>${T().strong} + ${T().early} + ${T().watch}</span><b>${c['STRONG SIGNAL']+c['EARLY SIGNAL']+c['WATCH']}</b></div><div class="kv"><span>${T().low}</span><b>${c['LOW CONFIDENCE']}</b></div></div><div class="panel"><h3>${T().watchlist}</h3><div class="kv"><span>${T().persisted}</span><b>${watchRows.length}</b></div><p class="small">${T().stored}</p></div>`}
async function renderCurrent(){document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===activeView));$('results').style.display='none';$('panels').style.display='none';$('sortWrap').style.display=['discover','watchlist','dossiers'].includes(activeView)?'flex':'none';const title=T().titles[activeView];$('viewTitle').textContent=title[0];$('viewSub').textContent=title[1];renderFilters();if(activeView==='discover'||activeView==='dossiers'){$('results').style.display='grid';renderCards(rows)}else if(activeView==='watchlist'){$('results').style.display='grid';renderCards(watchRows)}else{$('panels').style.display='grid';if(activeView==='evidence')evidencePanels();if(activeView==='validation')await validationPanels();if(activeView==='analytics')analyticsPanels();if(activeView==='settings')settingsPanels()}}
function bindTabs(){document.querySelectorAll('.tab').forEach(t=>t.onclick=async()=>{activeView=t.dataset.view;activeFilter='ALL';await renderCurrent()})}
$('form').addEventListener('submit',async e=>{e.preventDefault();hideAlert();const term=$('q').value.trim();if(!term)return;$('meta').textContent=T().finding;$('sources').innerHTML='';rows=[];renderSummary();activeView='discover';activeFilter='ALL';renderCurrent();const full=fetch(`/api/scout?q=${encodeURIComponent(term)}&limit=20`);try{const p=await fetch(`/api/scout/preview?q=${encodeURIComponent(term)}&limit=6`),pd=await p.json();if(pd.sources)$('sources').innerHTML=sourceHTML(pd.sources);if(pd.complete===false&&pd.error)showAlert(T().previewWarning,pd.error.message)}catch(_){ }try{const r=await full,d=await r.json();if(!r.ok){const detail=d.detail||{};$('sources').innerHTML=sourceHTML(detail.sources||{});$('meta').textContent=T().failed;showAlert(T().failedTitle,detail.message||T().failedBody);return}rows=d.results||[];$('sources').innerHTML=sourceHTML(d.sources);$('meta').textContent=lang==='zh'?`${d.count}${T().validated} ${d.snapshot.observed_at}`:`${d.count} ${T().validated} ${d.snapshot.observed_at}`;renderSummary();renderCurrent()}catch(err){$('meta').textContent=T().failed;showAlert(T().failedTitle,err.message||T().failedBody)}})
$('sort').onchange=renderCurrent;$('closeDrawer').onclick=()=>$('drawer').classList.remove('open');$('langBtn').onclick=toggleLanguage;$('themeBtn').onclick=cycleTheme;applyTheme();applyLanguage();(async()=>{await loadWatch();renderSummary();renderCurrent()})();
</script>
</body>
</html>
