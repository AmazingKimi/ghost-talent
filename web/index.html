<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Ghost Talent</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"/><style>
:root{color-scheme:light;--ink:#111;--muted:#6d6d6d;--line:#e8e8e8;--paper:#fafafa}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#fff;color:var(--ink)}main{max-width:1120px;margin:0 auto;padding:72px 28px 96px}h1{font-size:64px;line-height:.95;letter-spacing:-.055em;margin:0 0 16px}.sub{font-size:20px;color:var(--muted);margin:0 0 42px}.search{display:flex;gap:10px;margin-bottom:36px}input{flex:1;font:inherit;font-size:17px;padding:17px 18px;border:1px solid #cfcfcf;border-radius:10px;outline:none}input:focus{border-color:#111}button{border:0;border-radius:10px;padding:0 22px;background:#111;color:#fff;font-weight:700;cursor:pointer}.meta{font-size:13px;color:var(--muted);margin:0 0 18px;min-height:18px}.sources{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 20px}.source{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:5px 8px}.source.bad{border-color:#111;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.card{border:1px solid var(--line);border-radius:14px;padding:20px;background:var(--paper)}.card.early{border-color:#111;box-shadow:inset 0 3px 0 #111}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.name{font-weight:750;font-size:20px;letter-spacing:-.02em}.login{color:var(--muted);font-size:13px;margin-top:3px}.score{font-size:34px;font-weight:800;letter-spacing:-.05em}.label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:20px 0}.metric strong{display:block;font-size:16px}.metric span{font-size:10px;color:var(--muted)}.signal,.rising{display:inline-block;margin:0 5px 10px 0;padding:5px 8px;border-radius:999px;background:#111;color:#fff;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.history,.trajectory{font-size:11px;color:var(--muted);margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em}.trajectory{padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.trend{display:inline-block;font-size:12px;font-weight:650;margin:10px 0}.first-detected{font-size:11px;color:var(--muted);margin:0 0 14px;text-transform:uppercase;letter-spacing:.06em}.why,.evidence{border-top:1px solid var(--line);padding-top:14px;margin-top:2px}.evidence{margin-top:14px}.why-title{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}.why div{font-size:12px;line-height:1.5;margin:5px 0;color:#333}.evidence a{color:#111;text-decoration:none}.evidence div{font-size:13px;line-height:1.45;margin:8px 0}.empty{color:var(--muted);font-size:14px;padding:28px 0}@media(max-width:650px){h1{font-size:48px}.search{flex-direction:column}button{height:52px}}
</style></head><body><main><h1>Ghost Talent</h1><p class="sub">Discover emerging AI talent before they become obvious.</p><form class="search" id="form"><input id="q" value="LLM inference CUDA Triton" aria-label="Technical topic"/><button type="submit">SCOUT</button></form><p class="meta" id="meta">Search public technical evidence from GitHub and OpenAlex.</p><div class="sources" id="sources"></div><section class="grid" id="results"></section></main><script>
const form=document.getElementById('form'),q=document.getElementById('q'),meta=document.getElementById('meta'),sources=document.getElementById('sources'),results=document.getElementById('results');let firstDetected={};
function esc(v){return String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}function formatDate(v){if(!v)return'unknown';const d=new Date(v);return Number.isNaN(d.getTime())?v:d.toISOString().slice(0,10)}function signed(v){return Number(v)>0?`+${v}`:String(v)}
function sourceRows(map){return Object.entries(map||{}).map(([n,i])=>{const s=i?.status||'unavailable',b=s!=='ok';return `<span class="source ${b?'bad':''}" title="${esc(i?.detail||'')}">${esc(n.toUpperCase())} · ${esc(s.replace('_',' '))}</span>`}).join('')}
function evidenceRows(c){return(c.evidence||[]).slice(0,6).map(e=>{let l='Evidence';if(e.type==='paper')l=`${e.value.title||'Paper'} · ${e.value.citations??0} citations`;else if(e.type==='merged_pull_request')l=`Merged PR #${e.value.number??'?'} · ${e.value.title||'technical contribution'}`;else l=`${e.value.repository||'Repository'} · ${e.value.contributions??0} contributions`;return `<div><a href="${esc(e.source_url)}" target="_blank" rel="noreferrer">↗ ${esc(l)}</a></div>`}).join('')}
function historyRows(row){const h=row.history||{};if(h.status!=='comparable')return `<div class="history">Building history${h.reason==='score_version_changed'?' · score version changed':' · no comparable prior snapshot'}</div>`;return `<div class="history">Last snapshot · score ${h.previous_score} → ${row.ghost_score} (${signed(h.score_delta)}) · rank ${signed(h.rank_delta)} places</div>`}
function windowLabel(name,w){if(!w||w.status!=='comparable')return `${name} building`;const radar=w.radar_delta!==undefined?` · ${signed(w.radar_delta)} radar`:'';return `${name} ${signed(w.score_delta)} score · ${signed(w.rank_delta)} rank${radar}`}
function trajectoryRows(row){const t=row.trajectory||{};return `<div class="trajectory">Trajectory · ${windowLabel('7D',t.d7)} · ${windowLabel('30D',t.d30)} · ${t.observation_count??1} observations</div>`}
function risingBadge(row){const rf=row.trajectory?.rising_fast_v2||{};if(rf.status!=='rising')return'';const d7=row.trajectory?.d7||{};return `<div class="rising" title="${esc((rf.reasons||[]).join(' · '))}">Rising Fast · 7D ${signed(d7.score_delta??0)}</div>`}
function driverRows(row){const d=row.drivers||{},cap=d.capability||{},quality=d.contribution_quality||{},mom=d.momentum||{},vis=d.visibility||{},conf=d.confidence||{},radar=d.radar||{},top=cap.top_repository,accel=mom.acceleration_ratio??0,al=accel>=1.2?'above prior baseline':accel<.8?'below prior baseline':'near prior baseline';let ql='<strong>Contribution quality:</strong> unavailable';if(quality.available&&quality.top_pr){const pr=quality.top_pr,k=(pr.keyword_hits||[]).slice(0,5).join(', ')||'no core keyword match';ql=`<strong>Contribution quality:</strong> ${quality.score} / 100 · ${quality.merged_pr_count??0} merged PRs · top PR touches ${pr.core_file_count??0} core files · ${esc(k)}`}return `<div class="why-title">Why this score</div><div><strong>Capability:</strong> ${top?`${esc(top.name)} · ${top.contributions??0} contributions · ${top.stars??0} stars`:'no repository evidence'} · base ${cap.base_capability??0}</div><div>${ql}</div><div><strong>Momentum:</strong> ${mom.events_7d??0} events / 7d · ${mom.events_30d??0} / 30d · ${mom.active_days_30d??0} active days · ${esc(al)}</div><div><strong>Visibility:</strong> ${vis.followers??0} followers</div><div><strong>Radar:</strong> ${radar.score??row.radar_score??0} / 100</div><div><strong>Confidence:</strong> ${(conf.reasons||[]).map(esc).join(' · ')||'limited evidence'}</div>`}
function card(row){const c=row.candidate,detected=firstDetected[c.login];return `<article class="card ${row.early_signal?'early':''}"><div class="top"><div><div class="name">${esc(c.name||c.login)}</div><div class="login">@${esc(c.login)}</div></div><div><div class="score">${row.ghost_score}</div><div class="label">Ghost Score</div></div></div><div class="metrics"><div class="metric"><strong>${row.capability}</strong><span>Capability</span></div><div class="metric"><strong>${row.momentum}</strong><span>Momentum</span></div><div class="metric"><strong>${row.visibility_gap}</strong><span>Visibility Gap</span></div><div class="metric"><strong>${row.evidence_confidence}</strong><span>Confidence</span></div></div>${row.early_signal?`<div class="signal">Early Signal · Radar ${row.radar_score}</div>`:''}${risingBadge(row)}${historyRows(row)}${trajectoryRows(row)}<div class="trend">${esc(row.trend.toUpperCase())} · v${esc(row.score_version||'')}</div><div class="first-detected">First detected · ${esc(formatDate(detected))}</div><div class="why">${driverRows(row)}</div><div class="evidence">${evidenceRows(c)||'<div>No supporting evidence returned.</div>'}</div><div class="evidence"><div><a href="${esc(c.profile_url)}" target="_blank" rel="noreferrer">↗ GitHub profile</a></div></div></article>`}
form.addEventListener('submit',async e=>{e.preventDefault();const term=q.value.trim();if(!term)return;meta.textContent='Scouting public technical evidence…';sources.innerHTML='';results.innerHTML='';try{const r=await fetch(`/api/scout?q=${encodeURIComponent(term)}&limit=20`),data=await r.json();if(!r.ok)throw new Error(data.detail||'Scout failed');firstDetected=data.snapshot?.first_detected||{};sources.innerHTML=sourceRows(data.sources);const locked=data.snapshot?.observed_at?` · snapshot locked ${data.snapshot.observed_at.replace('T',' ').replace('Z',' UTC')}`:'',signals=data.results.filter(x=>x.early_signal).length,rising=data.results.filter(x=>x.trajectory?.rising_fast_v2?.status==='rising').length,degraded=Object.values(data.sources||{}).some(x=>x.status!=='ok');meta.textContent=`${data.count} candidates · ${signals} early signals · ${rising} rising fast · ${degraded?'partial evidence':'sources healthy'}${locked}`;results.innerHTML=data.results.map(card).join('')||'<div class="empty">No candidates found from currently available sources.</div>'}catch(err){meta.textContent=err.message}})
</script></body></html>
